# Baseline Configuration - Standard YOLO-v11n
# Replicates Nature paper setup without illumination awareness

experiment:
  name: "baseline_yolov11n"
  seed: 42

model:
  architecture: "yolov11n"
  pretrained: true
  heads:
    - detection  # Only detection head, no morphology

data:
  dataset: "sombench_wac"
  img_size: 512
  batch_size: 32
  num_workers: 4

  augmentations:
    # Standard augmentations only (no illumination awareness)
    horizontal_flip: 0.5
    vertical_flip: 0.0  # Disabled to avoid relief inversion
    rotation: 15  # ±15 degrees
    brightness: 0.2
    contrast: 0.2
    blur: 0.3

training:
  epochs: 100
  optimizer: "AdamW"
  learning_rate: 0.001
  weight_decay: 0.0005
  lr_scheduler: "cosine"
  warmup_epochs: 5

  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_loss"

  checkpoint:
    save_every: 5
    save_best: true
    monitor: "val_map50"

loss:
  detection: "CIoU"
  classification: "cross_entropy"
  weights:
    detection: 1.0
    classification: 0.5
